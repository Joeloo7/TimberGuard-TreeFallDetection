{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimberGuard</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2d6a4f;
            color: white;
            text-align: center;
            position: relative;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
        }
        
        h1 {
            font-size: 3em;
            margin: 0;
            color: #ffcc00; /* Flashy yellow color */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .button {
            background: #74c69d;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            color: black;
            text-decoration: none;
            margin-top: 20px;
        }
        
        .button:hover {
            background: #95d5b2;
        }
        
        .about-button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #f4a261;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            color: black;
            text-decoration: none;
        }
        
        .about-button:hover {
            background: #e76f51;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>TimberGuard</h1>
        <div class="logo">
            <img src="{%static 'logo.jpg'%}" style="border-radius: 60px;" width="90" height="90">
        </div>
    </div>
    <form method="post">
        <button type="submit" name="name" value="disease" class="button">Calculate Risk</button>
        <button type="submit" name="name" value="aboutus" class="about-button">About Us</button>
    </form>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimberGuard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #d4edda; /* Light green background */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        input[type="file"] {
            margin-bottom: 15px;
        }
        input[type="submit"] {
            background-color: #218838; /* Dark green */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #1e7e34;
        }
        .result-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .result {
            font-size: 18px;
            font-weight: bold;
            color: #155724; /* Darker green */
        }
        .image-box img {
            margin-top: 10px;
            max-width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>TimberGuard - Tree Disease Detection</h1>

    <div class="container">
        <div class="box">
            <form method="post" enctype="multipart/form-data">
                <label for="file-upload">Upload Trunk Image</label>
                <input id="file-upload" capture="environment" type="file" accept=".jpg,.jpeg,.png,.jfif" name="infile">
                <br>
                <input type="submit" name="sub" value="Predict Disease">
            </form>
        </div>

        <div class="result-box">
            <div class="result">Result: {{ flag }}</div>
            <div class="image-box">
                <img src="{{ url }}" alt="">
            </div>
            <form method="post">
                <input type="hidden" name="result" value="{{flag}}">
                <button type="submit" name="sub" value="next">next
                </button>

            </form>
        </div>
    </div>

</body>
</html>
